<!DOCTYPE html>
<html>

<head>
    <title>Vokabeltrainer - Bearbeiten</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <nav class="navbar">
            <ul class="navbar-list">
                <li class="navbar-item"><a href="/">Vokabeln Trainieren</a></li>
                <li class="navbar-item"><a href="/edit">Vokabeln Hinzufügen/Entfernen</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1>Vokabeltrainer - Bearbeiten</h1>
        <table class="edit-table">
            <thead>
                <tr>
                    <th>Französisch</th>
                    <th>Deutsch</th>
                    <th>Aktionen</th>
                </tr>
            </thead>
            <tbody>
                {% for vokabel in vokabeln %}
                <tr>
                    <td>
                        <input type="text" name="franzoesisch[]" value="{{ vokabel.franzoesisch }}" readonly>
                    </td>
                    <td>
                        <input type="text" name="deutsch[]" value="{{ vokabel.deutsch }}" readonly>
                    </td>
                    <td>
                        <form action="/delete/{{ vokabel.id }}" method="POST" style="display:inline;">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit">Löschen</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
                <tr>
                    <td colspan="3">
                        <form class="edit-form" action="/save" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <input type="text" name="neu_franzoesisch" placeholder="Neues französisches Wort">
                            <input type="text" name="neu_deutsch" placeholder="Übersetzung">
                            <button type="submit">Speichern</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
